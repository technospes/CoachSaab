name: ai_coach_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter_3d_controller: ^2.3.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.12.0+2
  permission_handler: 12.0.3
  http: ^1.6.0
  google_mlkit_pose_detection: ^0.15.0
  hand_landmarker: ^3.0.0
  shared_preferences: ^2.3.2
  flutter_tts: ^4.2.2
  intl: ^0.20.3
  flutter_markdown: ^0.7.7+1
  flutter_secure_storage: 9.2.2
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  mocktail_image_network: ^1.3.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/App_Icon_Logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/models/pose_landmarker_lite.task
    - assets/images/flat/
    - assets/models/pose_landmarker_lite.task
    - assets/models/pose_landmarker_full.task
    - assets/images/Splash_Screen_Icon.png
    - assets/icons/Login_Avatar.png
    - assets/App_Icon_Logo.png
    - assets/icons/Tree_Pose_Image.png
    - assets/icons/bicep_curls_session_Icon.jpg
    - assets/icons/running_session_icon.png
    - assets/icons/Squat_Session_icon.png
    - assets/exercises/squat.json
    - assets/exercises/bicep_curl.json
    - assets/exercises/tree_pose.json
    - assets/exercises/running.json
    - assets/coaching/coaching_phrases.json
    - assets/models/coachsaab.glb
    - assets/images/coachsaab_static.png
    - assets/images/coachsaab_talking.png
    - assets/images/female_profile.png
    - assets/images/male_profile.png